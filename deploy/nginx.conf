# For a machine that already runs nginx: the rendezvous server as one more site. install.sh
# (PROXY=nginx) fills in the name and port, then certbot adds the TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name LONGARM_DOMAIN;

    location = /v1 {
        proxy_pass http://127.0.0.1:LONGARM_PORT;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://127.0.0.1:LONGARM_PORT;
    }

    location / {
        return 404;
    }
}
